<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script>
  var l = window.location;
  // GitHub Pages serves this project site under /BAFLY/ — keep that prefix so the
  // SPA (React Router basename="/BAFLY") can restore the original route.
  l.replace(l.protocol + '//' + l.host + '/BAFLY/?p=' + encodeURIComponent(l.pathname + l.search) + l.hash);
</script>
</head>
<body></body>
</html>
