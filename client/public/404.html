<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script>
  var l = window.location;
  // Custom domain (bafly.online) serves the SPA at the root. Preserve the
  // requested route in ?p= so index.html can restore it via history.replaceState.
  l.replace(l.protocol + '//' + l.host + '/?p=' + encodeURIComponent(l.pathname + l.search) + l.hash);
</script>
</head>
<body></body>
</html>
